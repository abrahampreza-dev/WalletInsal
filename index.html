<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220%22 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="SL-BITS Wallet - Billetera Digital del Instituto San Luis para la Expotecnia 2026" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>SL-BITS Wallet | Instituto San Luis - Expotecnia 2026</title>
    <style>
      #splash-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0A4D9C 0%, #07366E 100%);
        transition: opacity 0.4s ease-out;
      }
      #splash-screen.hide {
        opacity: 0;
        pointer-events: none;
      }
      .splash-logo {
        width: 80px;
        height: 80px;
        border-radius: 24px;
        background: white;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        animation: pulse-logo 1.5s ease-in-out infinite;
        margin-bottom: 24px;
      }
      .splash-logo span { font-size: 42px; }
      .splash-title {
        color: white;
        font-family: 'Outfit', 'Plus Jakarta Sans', system-ui, sans-serif;
        font-size: 22px;
        font-weight: 800;
        letter-spacing: -0.5px;
        margin-bottom: 6px;
      }
      .splash-subtitle {
        color: rgba(255,255,255,0.7);
        font-family: 'Outfit', system-ui, sans-serif;
        font-size: 12px;
        font-weight: 500;
        margin-bottom: 32px;
      }
      .splash-bar-track {
        width: 180px;
        height: 4px;
        border-radius: 999px;
        background: rgba(255,255,255,0.2);
        overflow: hidden;
      }
      .splash-bar {
        width: 40%;
        height: 100%;
        border-radius: 999px;
        background: linear-gradient(90deg, #E67A15, #D19E37);
        animation: slide-bar 1.2s ease-in-out infinite;
      }
      @keyframes pulse-logo {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.05); }
      }
      @keyframes slide-bar {
        0% { transform: translateX(-100%); }
        100% { transform: translateX(350%); }
      }
    </style>
  </head>
  <body class="bg-[#F7F8FA] text-slate-800 min-h-screen antialiased selection:bg-orange-500 selection:text-white">

    <!-- Splash screen: se ve mientras React carga -->
    <div id="splash-screen">
      <div class="splash-logo"><span>⚡</span></div>
      <div class="splash-title">SL-BITS Wallet</div>
      <div class="splash-subtitle">Instituto San Luis · Expotecnia 2026</div>
      <div class="splash-bar-track"><div class="splash-bar"></div></div>
    </div>

    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Limpiar cache viejo cuando cambia la versión
      var APP_VERSION = 'v2-walletinsals';
      var storedVersion = localStorage.getItem('app_version');
      if (storedVersion !== APP_VERSION) {
        localStorage.clear();
        sessionStorage.clear();
        localStorage.setItem('app_version', APP_VERSION);
      }
      // Ocultar splash cuando React monte
      window.addEventListener('load', function() {
        setTimeout(function() {
          var el = document.getElementById('splash-screen');
          if (el) { el.classList.add('hide'); setTimeout(function() { el.remove(); }, 500); }
        }, 500);
      });
    </script>
  </body>
</html>
